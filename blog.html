---
layout: default
title: Blog Técnico
---
<div style="max-width: 800px; margin: 40px auto; padding: 20px;">
    <h1 style="color: var(--tertiary); margin-bottom: 30px;">Últimos Artigos</h1>
    
    <div style="display: flex; flex-direction: column; gap: 20px;">
        {% for post in site.posts %}
        <div style="background: var(--card-bg); padding: 25px; border-radius: 10px; border-left: 4px solid var(--tertiary);">
            <h2 style="margin: 0 0 10px 0;"><a href="{{ post.url | relative_url }}" style="color: white; text-decoration: none;">{{ post.title }}</a></h2>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 15px;">{{ post.date | date: "%d/%m/%Y" }}</p>
            <p style="color: #ccc;">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
            <a href="{{ post.url | relative_url }}" style="color: var(--tertiary); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px;">Ler artigo &rarr;</a>
        </div>
        {% endfor %}
    </div>
</div>
